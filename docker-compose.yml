services:
  db:
    image: postgis/postgis:17-3.5
    # Upstream image is amd64; Apple Silicon uses Docker's emulation.
    platform: linux/amd64
    environment:
      POSTGRES_USER: futureproof
      POSTGRES_PASSWORD: futureproof
      POSTGRES_DB: futureproof
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureproof -d futureproof"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgis_data:
